name: CI Generate Spec

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: khronosgroup/docker-images@sha256:0f91e60e1af2bdd889783af3907f63279c08f573f2eccbc31094e348d1a32a4f

    defaults:
      run:
        shell: bash
        working-directory: /tmp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install libraries
        run: apt update && apt install -y libgl-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev

      - name: Generate Vulkan Headers
        run: |
          git clone https://github.com/KhronosGroup/Vulkan-Docs.git --depth 1
          cd Vulkan-Docs/xml
          make clean install codec_headers
          cd ../..

          # Copy headers to Vulkan-Headers (makes it easier for Vulkan-Hpp)
          rm -rf Vulkan-Headers/include/
          cp -r Vulkan-Docs/gen/include/ Vulkan-Headers/include/
          
      - name: Generate Vulkan-Hpp and Build Samples/Tests
        run: |
          cmake -B build -G Ninja                      \
          -D VulkanRegistry_DIR=${PWD}/Vulkan-Docs/xml \
          -D VULKAN_HPP_GENERATOR_BUILD=ON             \
          -D VULKAN_HPP_RUN_GENERATOR=ON               \
          -D VULKAN_HPP_SAMPLES_BUILD=ON               \
          -D VULKAN_HPP_TESTS_BUILD=ON                 \
          -D VULKAN_HPP_TESTS_CTEST=ON                 \
          -D VULKAN_HPP_DISPATCH_LOADER_DYNAMIC=ON     \
          -D VULKAN_HPP_BUILD_WITH_LOCAL_VULKAN_HPP=ON \
          -D VULKAN_HPP_PRECOMPILE=OFF                 \
          -D CMAKE_C_COMPILER=gcc                      \
          -D CMAKE_CXX_COMPILER=g++                    \
          -D CMAKE_CXX_STANDARD=23                     \
          -D CMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest -j --output-on-failure --test-dir build
